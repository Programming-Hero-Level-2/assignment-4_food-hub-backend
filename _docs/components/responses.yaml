UnauthorizedError:
  description: Access token is missing or invalid
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            example: 401
          message:
            type: string
            example: Unauthorized
201:
  description: Successfully created
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            example: 201
          success:
            type: boolean
            example: true
          message:
            type: string
            example: Resource created successfully
          data:
            type: object

400:
  description: Bad request
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            format: int32
            example: 400
          success:
            type: boolean

            example: false
          error:
            type: string

            example: Bad Request
          message:
            type: string
            example: The request could not be understood or was missing required parameters.
          data:
            type: array
            items:
              type: object
              properties:
                field:
                  type: string
                  example: email
                message:
                  type: string

                  example: This field is required.
                issue:
                  type: string
                  example: Invalid email format
                in:
                  type: string
                  enum:
                    - body
                    - query
                    - path
                  example: body

401:
  description: Unauthorized access
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            format: int32
            example: 401
          success:
            type: boolean

            example: false
          error:
            type: string

            example: Unauthorized access
          message:
            type: string
            example: You don't have the right permissions to access this resource.

403:
  description: Forbidden - You don't have permission
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            format: int32
            example: 403
          success:
            type: boolean
            example: false

          error:
            type: string

            example: Forbidden
          message:
            type: string

            example: Forbidden - You don't have permission

404:
  description: Resource not found
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            format: int32
            example: 404
          success:
            type: boolean

            example: false
          error:
            type: string

            example: Not Found
          message:
            type: string
            example: Resource not found

409:
  description: Conflict - Resource already exists
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            format: int32
            example: 409
          success:
            type: boolean

            example: false
          error:
            type: string

            example: Conflict
          message:
            type: string

            example: Conflict - Resource already exists

500:
  description: Internal server error Occurred
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            format: int32
            example: 500
          success:
            type: boolean

            example: false
          error:
            type: string

            example: Internal Server Error
          message:
            type: string
            example: We are sorry for the inconvenience. please try again later

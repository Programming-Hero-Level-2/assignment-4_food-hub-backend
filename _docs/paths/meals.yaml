providerMeals:
  get:
    summary: Get all meals (Private)
    operationId: getAllMealsPrivate
    tags:
      - Provider - Meals / Menu
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/idPathParam'
      - $ref: '../components/parameters.yaml#/pageParam'
      - $ref: '../components/parameters.yaml#/limitParam'
      - $ref: '../components/parameters.yaml#/filterParam'
      - $ref: '../components/parameters.yaml#/sortByParam'
      - $ref: '../components/parameters.yaml#/sortTypeParam'
      - $ref: '../components/parameters.yaml#/searchParam'
    responses:
      '200':
        description: meals retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 200
                success:
                  type: boolean

                  example: true
                message:
                  type: string

                  example: meals retrieved successfully
                data:
                  type: array
                  items:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 64b64c4f2f9b9c0012345678
                          name:
                            type: string

                            example: Spaghetti Carbonara
                          description:
                            type: string

                            example: Classic Italian pasta dish with eggs, cheese, pancetta, and pepper.
                          slug:
                            type: string

                            example: spaghetti-carbonara
                          price:
                            type: number
                            format: float
                            example: 12.99
                          discount:
                            type: number
                            format: float
                            example: 0.15
                          discount_type:
                            type: string

                            example: PERCENT
                            default: null
                            enum: [PERCENT, FLAT, null]
                          status:
                            type: string

                            example: AVAILABLE
                            enum: [AVAILABLE, UNAVAILABLE, STOCK_OUT, ARCHIVED]
                          restaurantId:
                            type: string
                            format: uuid
                            example: 64b64c4f2f9b9c001234567
                          categoryId:
                            type: string
                            format: uuid
                            example: 64b64c4f2f9b9c001234567
                          imageUrl:
                            type: string
                            format: uri
                            example: https://example.com/imageUrls/spaghetti-carbonara.jpg
                          thumbnails:
                            type: array
                            items:
                              type: string
                              format: uri
                              example: https://example.com/imageUrls/spaghetti-carbonara-thumb.jpg
                          categories:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  example: 64b64c4f2f9b9c001234567
                                name:
                                  type: string

                                  example: Italian
                      - $ref: '../components/schemas.yaml#/Timestamps'
                links:
                  type: object
                  properties:
                    self:
                      type: string
                      format: uri
                      example: /private/meals
                    next:
                      type: string
                      format: uri
                      example: /private/meals?page=3&limit=10
                    prev:
                      type: string
                      format: uri
                      example: /private/meals?page=1&limit=10
                    meal:
                      type: string
                      format: uri
                      example: /private/meals/c6f1e8e2-3b5b-4d2a-9f7e-2d6f4e8e2a3b
                    restaurants:
                      type: string
                      format: uri
                      example: /private/restaurants
                    categories:
                      type: string
                      format: uri
                      example: /private/categories
                pagination:
                  $ref: '../components/schemas.yaml#/Pagination'

      '400':
        $ref: '../components/responses.yaml#/400'
      '401':
        $ref: '../components/responses.yaml#/401'
      '403':
        $ref: '../components/responses.yaml#/403'
      '500':
        $ref: '../components/responses.yaml#/500'

createProviderMeals:
  post:
    summary: Create a new meal (Private)
    operationId: createMealProvider
    tags:
      - Provider - Meals / Menu
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string

                example: Spaghetti Carbonara
              description:
                type: string

                example: Classic Italian pasta dish with eggs, cheese, pancetta, and pepper.
              price:
                type: number
                format: float
                example: 12.99
              discount:
                type: number
                format: float
                example: 0.15
              discount_type:
                type: string

                example: PERCENT
                default: null
                enum: [PERCENT, FLAT, null]
              restaurantId:
                type: string
                format: uuid
                example: 64b64c4f2f9b9c0012345678
              categoryId:
                type: string
                format: uuid
                example: 64b64c4f2f9b9c0012345678
              imageUrl:
                type: string
                format: uri
                example: https://example.com/imageUrls/spaghetti-carbonara.jpg
              thumbnails:
                type: array
                items:
                  type: string
                  format: uri
                  example: https://example.com/imageUrls/spaghetti-carbonara-thumb.jpg
              status:
                type: string

                example: AVAILABLE
                enum: [AVAILABLE, UNAVAILABLE, STOCK_OUT, ARCHIVED]
            required:
              - name
              - description
              - price
              - restaurantId
              - categoryId
              - status
    responses:
      '201':
        description: meal created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 201
                success:
                  type: boolean

                  example: true
                message:
                  type: string

                  example: meal created successfully
                data:
                  $ref: '../components/schemas.yaml#/MealCreateDTO'
      '401':
        $ref: '../components/responses.yaml#/401'
      '403':
        $ref: '../components/responses.yaml#/403'
      '400':
        $ref: '../components/responses.yaml#/400'
      '500':
        $ref: '../components/responses.yaml#/500'


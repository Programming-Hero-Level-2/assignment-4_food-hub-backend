# Provider Restaurant Management Endpoints (Provider Only)
providerRestaurants:
  get:
    summary: Get all restaurants (Provider and Admin)
    security:
      - BearerAuth: []
    operationId: getAllRestaurantsProvider
    tags:
      - Provider - Restaurants
    parameters:
      - $ref: '../components/parameters.yaml#/pageParam'
      - $ref: '../components/parameters.yaml#/limitParam'
      - $ref: '../components/parameters.yaml#/searchParam'
      - $ref: '../components/parameters.yaml#/filterParam'
      - $ref: '../components/parameters.yaml#/sortByParam'
      - $ref: '../components/parameters.yaml#/sortTypeParam'
    responses:
      '200':
        description: A list of restaurants
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 200
                success:
                  type: boolean

                  example: true
                message:
                  type: string

                  example: Restaurants retrieved successfully
                data:
                  type: array
                  items:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: c6f1e8e2-3b5b-4d2a-9f7e-2d6f4e8e2a3b
                          name:
                            type: string

                            example: Pizza Palace
                          address:
                            type: string

                            example: 123 Main St, Cityville
                          opening_time:
                            type: string
                            format: time
                            example: '10:00 AM'
                          closing_time:
                            type: string
                            format: time
                            example: '10:00 PM'
                          status:
                            type: string
                            enum: [active, inactive]
                            example: active

                          opening_status:
                            type: string
                            enum:
                              - open
                              - closed
                            example: open

                      - required:
                          - id
                          - name
                          - opening_time
                          - closing_time
                          - status
                          - opening_status
                      - $ref: '../components/schemas.yaml#/Timestamps'
                pagination:
                  $ref: '../components/schemas.yaml#/Pagination'
                links:
                  type: object
                  properties:
                    self:
                      type: string
                      format: url
                      example: /private/restaurants
                    meals:
                      type: string
                      format: url
                      example: /private/restaurants/3dbda234xxdd3/meals
      '400':
        $ref: '../components/responses.yaml#/400'
      '401':
        $ref: '../components/responses.yaml#/401'
      '403':
        $ref: '../components/responses.yaml#/403'
      '500':
        $ref: '../components/responses.yaml#/500'
  post:
    summary: Create a new restaurant (Provider and Admin)
    security:
      - BearerAuth: []
    operationId: createRestaurant
    tags:
      - Private Restaurants
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string

                example: Pizza Palace
              ownership:
                type: string

                example: John Doe
              opening_time:
                type: string
                format: time
                example: '10:00 AM'
              closing_time:
                type: string
                format: time
                example: '10:00 PM'
              address:
                type: string

                example: 123 Main St, Cityville
              latitude:
                type: number
                format: float
                example: 40.7128
              longitude:
                type: number
                format: float
                example: -74.0060
              logo:
                type: string
                format: uri
                example: http://example.com/logo.png
              cover:
                type: string
                format: uri
                example: http://example.com/cover.jpg
              status:
                type: string
                enum: [active, inactive]
                example: active
              opening_status:
                type: string
                enum: [open, closed]
                example: open
            required:
              - name
              - ownership
              - opening_time
              - closing_time
              - address
              - status
              - opening_status
    responses:
      '201':
        description: Restaurant created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RestaurantCreateDTO'
      '400':
        $ref: '../components/responses.yaml#/400'
      '401':
        $ref: '../components/responses.yaml#/401'
      '403':
        $ref: '../components/responses.yaml#/403'
      '404':
        $ref: '../components/responses.yaml#/404'
      '500':
        $ref: '../components/responses.yaml#/500'
providerRestaurantById:
  get:
    summary: Get restaurant by ID (Provider and Admin)
    security:
      - BearerAuth: []
    operationId: getRestaurantByIdPrivate
    tags:

# Public category endpoints for customers
publicCategories:
  get:
    summary: Get all active restaurant categories (Public)
    operationId: getActiveRestaurantCategories
    tags:
      - Public - Discovery
    parameters:
      - $ref: '../components/parameters.yaml#/pageParam'
      - $ref: '../components/parameters.yaml#/limitParam'
      - $ref: '../components/parameters.yaml#/sortTypeParam'
      - $ref: '../components/parameters.yaml#/sortByParam'
      - $ref: '../components/parameters.yaml#/searchParam'
    responses:
      '200':
        description: A list of active restaurant categories
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 200
                success:
                  type: boolean

                  example: true
                message:
                  type: string

                  example: Active restaurant categories retrieved successfully
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 64b64c4f-2f9b-4c00-9234-123456789abc
                      name:
                        type: string
                        example: Italian
                      imageUrl:
                        type: string
                        format: uri
                        nullable: true
                        example: https://example.com/imageUrls/italian.jpg
                      subCategories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              example: b1c2d3e4-f5a6-7b8c-9d0e-f1a2b3c4d5e6
                            name:
                              type: string
                              example: Pizza

                links:
                  type: object
                  properties:
                    self:
                      type: string
                      format: uri
                      example: https://api.example.com/public/categories?page=1&limit=10
                    next:
                      type: string
                      format: uri
                      example: https://api.example.com/public/categories?page=2&limit=10
                    prev:
                      type: string
                      format: uri
                      example: null
                pagination:
                  $ref: '../components/schemas.yaml#/Pagination'
      '400':
        $ref: '../components/responses.yaml#/400'
      '500':
        $ref: '../components/responses.yaml#/500'
publicCategoryById:
  get:
    summary: Get an active restaurant category by ID (Public)
    operationId: getActiveRestaurantCategoryById
    tags:
      - Public - Discovery
    parameters:
      - $ref: '../components/parameters.yaml#/idPathParam'
    responses:
      '200':
        description: Active restaurant category details
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 200
                success:
                  type: boolean

                  example: true
                message:
                  type: string

                  example: Active restaurant category retrieved successfully
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: 64b64c4f2f9b9c0012345678
                    name:
                      type: string

                      example: Italian
                    description:
                      type: string
                      example: Authentic Italian cuisine

                    imageUrl:
                      type: string
                      nullable: true
                      format: url
                      example: https://example.com/imageUrls/italian.jpg
                    sub_categories:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: b1c2d3e4-f5a6-7b8c-9d0e-f1a2b3c4d5e6
                          name:
                            type: string
                            example: Pizza

                      required:
                        - id
                        - name
                link:
                  type: object
                  properties:
                    self:
                      type: string
                      format: uri
                      example: /public/categories/64b64c4f2f9b9c0012345678

      '400':
        $ref: '../components/responses.yaml#/400'
      '404':
        $ref: '../components/responses.yaml#/404'
      '500':
        $ref: '../components/responses.yaml#/500'


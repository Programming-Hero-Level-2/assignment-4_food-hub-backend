# Provider Restaurant category management endpoints (Provider Only)
providerCategory:
  get:
    summary: Get all restaurant categories (Provider)
    operationId: getAllRestaurantCategories
    tags:
      - Provider - Categories
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/pageParam'
      - $ref: '../components/parameters.yaml#/limitParam'
      - $ref: '../components/parameters.yaml#/sortTypeParam'
      - $ref: '../components/parameters.yaml#/sortByParam'
      - $ref: '../components/parameters.yaml#/searchParam'
      - $ref: '../components/parameters.yaml#/filterParam'
    responses:
      '200':
        description: A list of restaurant categories
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 200
                success:
                  type: boolean

                  example: true
                message:
                  type: string

                  example: Restaurant categories retrieved successfully
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/Category'
                links:
                  type: object
                  properties:
                    self:
                      type: string
                      format: uri
                      example: https://api.example.com/private/categories?page=1&limit=10
                    next:
                      type: string
                      format: uri
                      example: https://api.example.com/private/categories?page=2&limit=10
                    prev:
                      type: string
                      format: uri
                      example: null
                pagination:
                  $ref: '../components/schemas.yaml#/Pagination'
      '400':
        $ref: '../components/responses.yaml#/400'
      401:
        $ref: '../components/responses.yaml#/401'
      '404':
        $ref: '../components/responses.yaml#/404'
      '500':
        $ref: '../components/responses.yaml#/500'
  post:
    summary: Create a new restaurant category (Provider and Admin)
    security:
      - BearerAuth: []
    operationId: createRestaurantCategory
    tags:
      - Provider - Categories
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: Fast Food
              slug:
                type: string

                example: fast-food
              description:
                type: string
                nullable: true
                example: Category for fast food restaurants

              imageUrl:
                type: string
                nullable: true
                format: url
                example: https://example.com/imageUrls/fast-food.jpg
              status:
                type: string
                enum: [active, inactive]
                example: active

              createdBy:
                type: string
                format: uuid
                example: 64b64c4f2f9b9c001234567
              parent:
                type: string
                nullable: true
                format: uuid
                example: 64b64c4f2f9b9c0012345600
            required:
              - name
              - slug
              - status
              - createdBy
    responses:
      '201':
        description: Restaurant category created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RestaurantCategoryCreateDTO'
      '400':
        $ref: '../components/responses.yaml#/400'
      401:
        $ref: '../components/responses.yaml#/401'
      '403':
        $ref: '../components/responses.yaml#/403'
      '500':
        $ref: '../components/responses.yaml#/500'
providerCategoryById:
  get:
    summary: Get a restaurant category by ID (Provider Only)

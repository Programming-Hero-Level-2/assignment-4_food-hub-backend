    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: Fast Food
              slug:
                type: string

                example: fast-food
              description:
                type: string
                nullable: true
                example: Category for fast food restaurants

              imageUrl:
                type: string
                nullable: true
                format: url
                example: https://example.com/imageUrls/fast-food.jpg
              status:
                type: string
                enum: [active, inactive]
                example: active

              createdBy:
                type: string
                format: uuid
                example: 64b64c4f2f9b9c001234567
              parent:
                type: string
                nullable: true
                format: uuid
                example: 64b64c4f2f9b9c0012345600
            required:
              - name
              - slug
              - status
              - createdBy

    responses:
      '200':
        description: Restaurant category replaced successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RestaurantCategoryCreateDTO'
      '400':
        $ref: '../components/responses.yaml#/400'
      401:
        $ref: '../components/responses.yaml#/401'
      '403':
        $ref: '../components/responses.yaml#/403'
      '404':
        $ref: '../components/responses.yaml#/404'
      '500':
        $ref: '../components/responses.yaml#/500'
  delete:
    summary: Delete a restaurant category (Provider Only)
    security:
      - BearerAuth: []
    operationId: deleteRestaurantCategory
    tags:
      - Provider - Categories
    parameters:
      - $ref: '../components/parameters.yaml#/idPathParam'
    responses:
      '204':
        description: Restaurant category deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 204
                success:
                  type: boolean

                  example: true
                message:
                  type: string

                  example: category deleted successfully
      '400':

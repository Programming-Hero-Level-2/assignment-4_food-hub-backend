openapi: 3.0.0
info:
  version: 1.0.0
  title: 'FSArmy - My Blog Api'
  description: This is the first professional api project we creating full-stack army. This is the simple blog api application where anyone can create a new account, login to their system and create article that will visible publicly
  contact:
    name: Fs Army
    url: http://fs-army.com
    email: support@mail.com
servers:
  - description: Dev Environment
    url: http://localhost:4000/api/v1

tags:
  - name: Auth
    description: Authorization Endpoints (public)
  - name: Article
    description: Article Endpoints (public + private)
  - name: Comment
    description: Comment Endpoints (private)
  - name: User
    description: User Endpoints (admin only)
paths:
  '/auth/register':
    post:
      description: create a new account
      tags: [Auth]
      requestBody:
        description: register a new user
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe

                email:
                  type: string
                  example: john@example.com
                  format: email
                password:
                  type: string
                  example: password123
                  format: password
              required: [name, email, password]
      responses:
        '201':
          description: signup successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 201
                  message:
                    type: string

                    example: signup successful
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: '/auth/signup'
                      signin:
                        type: string
                        example: '/auth/signin'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/400'
  '/auth/login':
    post:
      tags: [Auth]
      description: login to your account
      requestBody:
        description: login to your existing account
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: password123
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Signin successful
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: '/auth/signin'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
  '/articles':
    get:
      tags: [Article]
      description: Retrieve all published articles
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/sortTypeParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          description: Get all stored article
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  data:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              format: int32
                              example: 1
                            title:
                              type: string
                              example: title of article 1
                            cover:
                              type: string
                              example: https://s3.aws.com/images/myfirstblog/image-1.jpg
                            author:
                              $ref: '#/components/schemas/AuthorDTO'
                            link:
                              type: string
                              format: url
                              example: '/articles/1'
                          required: [id, title, author]
                        - $ref: '#/components/schemas/Timestamps'
                  pagination:
                    $ref: '#/components/schemas/pagination'
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: url
                        example: '/articles?page=2&limit=10'
                      next:
                        type: string
                        format: url
                        example: '/articles?page=3&limit=10'
                      prev:
                        type: string
                        format: url
                        example: '/articles?page=1&limit=10'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
    post:
      security:
        - bearerAuth: []

      operationId: createPost
      tags: [Article]
      description: create a new article
      requestBody:
        description: To Create a  new article user must need to provide valid data
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: first article
                body:
                  type: string
                  # format: text
                  example: Body of the first article
                cover:
                  type: string
                  format: url
                  example: https://s3.aws.com/images/myfirstblog/image-1.jpg
                status:
                  type: string
                  enum: [draft, published]
                  example: draft
              required: [title, body]
      responses:
        '201':
          description: Successfully created  a new article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCreateDTO'
                # type: object
                # properties:
                #   code:
                #     type: integer
                #     format: int32
                #     example: 201
                #   message:
                #     type: string
                #     example: Article created Successfully
                #   data:
                #     $ref: '#/components/schemas/Article'
                #   links:
                #     type: object
                #     properties:
                #       self:
                #         type: string
                #         format: url
                #         example: '/articles/1'
                #       author:
                #         type: string
                #         format: url
                #         example: '/article/1/author'
                #       comments:
                #         type: string
                #         format: url
                #         example: 'articles/1/comments'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  '/articles/{id}':
    get:
      operationId: getArticleById
      tags: [Article]
      description: Fetch a single article
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - in: query
          name: expand
          description: expand author and comment Object
          schema:
            type: string
            example: 'author,comment'
      responses:
        '200':
          description: Single Article view
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Article'
                      - type: object
                        properties:
                          author:
                            $ref: '#/components/schemas/AuthorDTO'
                      - type: object
                        properties:
                          comments:
                            type: array
                            items:
                              $ref: '#/components/schemas/Comment'
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: url
                        example: /articles/1
                      author:
                        type: string
                        format: url
                        example: /articles/1/author
                      comments:
                        type: string
                        format: url
                        example: /articles/1/comments
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    put:
      security:
        - BearerAuth: []

      operationId: articlePutById
      tags: [Article]
      description: Create or update entire article by ID
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        description: Update or create article using body data
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int32
                  example: 1
                title:
                  type: string
                  example: article title
                body:
                  type: string
                  # format: text
                  example: body of the article 1
                cover:
                  type: string
                  format: url
                  example: https://s3.aws.com/images/myfirstblog/image-1.jpg
                status:
                  type: string
                  enum: [draft, published]
                  example: draft
              required: [title, body]
      responses:
        '200':
          description: Article Successfully Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleUpdateDTO'

          # content: &article_update_content
          #   application/json:
          #     schema:
          #       type: object
          #       properties:
          #         code:
          #           type: integer
          #           format: int32
          #           example: 200
          #         message:
          #           type: string
          #           example: Article updated successfully
          #         data:
          #           $ref: '#/components/schemas/Article'
          #         links:
          #           type: object
          #           properties:
          #             self:
          #               type: string
          #               format: url
          #               example: /articles/1
        '201':
          $ref: '#/components/responses/201'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    patch:
      security:
        - BearerAuth: []

      operationId: patchArticleById
      tags: [Article]
      description: Partially updated an article by ID
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        description: Update using body data
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: article title
                body:
                  type: string
                  # format: text
                  example: article body
                cover:
                  type: string
                  format: url
                  example: https://s3.aws.com/images/myfirstblog/image-1.jpg
                status:
                  type: string
                  enum: [draft, published]
                  example: draft
      responses:
        '200':
          description: Article updated Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleUpdateDTO'
                #  type: object
                #  properties:
                #     code:
                #       type: integer
                #       format: int32
                #       example: 200
                #     message:
                #       type: string
                #       example: Article updated successfully
                #     data:
                #       $ref: "#/components/schemas/Article"
                #     links:
                #       type: object
                #       properties:
                #         self:
                #           type: string
                #           example: /articles/1
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      security:
        - bearerAuth: []
      tags: [Article]
      description: Delete an Article By ID
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '204':
          description: Article deleted Successfully
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      # bearerFormat: JWT

  schemas:
    Article:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int32
              example: 1
            authorId:
              type: integer
              format: int32
              example: 1
            title:
              type: string
              example: First Article
            body:
              type: string
              # format: text
              example: Body of the first article
            cover:
              type: string
              format: url
              example: https://s3.aws.com/images/myfirstblog/image-1.jpg
            status:
              type: string
              enum: [draft, published]
              example: draft
          required: [id, authorId, title, body, status]
        - $ref: '#/components/schemas/Timestamps'
    ArticleCreateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 201
        message:
          type: string
          example: Article Created Successfully
        data:
          $ref: '#/components/schemas/Article'
        links:
          type: object
          properties:
            self:
              type: string
              format: url
              example: /articles/1
              # put and patch contain only self link no need to author and comments links
            author:
              type: string
              format: url
              example: /articles/1/author
            comments:
              type: string
              format: url
              example: /articles/1/comments

    ArticleUpdateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        message:
          type: string
          example: Article Updated Successfully
        data:
          $ref: '#/components/schemas/Article'
        links:
          type: object
          properties:
            link:
              type: string
              format: url
              example: /articles/1
    Comment:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int32
              example: 1
            authorId:
              type: integer
              format: int32
              example: 1
            articleId:
              type: integer
              format: int32
              example: 1
            body:
              type: string
              example: The body of the comment
            status:
              type: string
              enum:
                - public
                - private
              example: public
          required:
            - id
            - authorId
            - articleId
            - body
            - status
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [createdAt, updatedAt]
    AuthorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: John Doe
      required: [id, name]
    pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 2
        limit:
          type: integer
          format: int32
          example: 10
        next:
          type: integer
          format: int32
          example: 3
        prev:
          type: integer
          format: int32
          example: 1
        totalPage:
          type: integer
          format: int32
          example: 15
        totalItems:
          type: integer
          format: int32
          example: 150
      required:
        - page
        - limit
        - totalPage
        - totalItems

  responses:
    '201':
      description: Successfully Created
      # content: *article_update_content
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArticleCreateDTO'
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 400
              error:
                type: string
                example: Bad Request
              data:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: email
                    message:
                      type: string
                      example: Invalid Email
                    in:
                      type: string
                      enum: [query, body]
                      example: body
    '401':
      description: Unauthorized access
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 401
              error:
                type: string
                example: Unauthorized access
              message:
                type: string
                example: You don't have the right permission
    '404':
      description: Resource Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 404
              error:
                type: string
                example: Not Found
              message:
                type: string
                example: Requested resource Not Found
    '500':
      description: Internal Server Error Occurred
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 500
              error:
                type: string
                example: Internal Server Error Occurred
              message:
                type: string
                example: We are sorry for the inconvenience. please try again later

  parameters:
    pageParam:
      in: query
      name: page
      description: current page number
      schema:
        type: integer
        format: int32
        example: 2
    limitParam:
      in: query
      name: limit
      description: Maximum items to be return
      schema:
        type: integer
        format: int32
        example: 10
    sortTypeParam:
      in: query
      name: sort_type
      description: The type of sort (asc or dsc)
      schema:
        type: string
        enum: [asc, dsc]
        example: dsc
    sortByParam:
      in: query
      name: sort_by
      description: Sort key
      schema:
        type: string
        example: updatedAt
    searchParam:
      in: query
      name: search
      description: Search Term
      schema:
        type: string
        example: title
    idPathParam:
      in: path
      name: id
      required: true
      description: Article ID
      schema:
        type: string
        example: 658294fc512b51a22147e014

        '500':
          $ref: '#/components/responses/500'

  /public/categories/{id}:
    get:
      summary: Get an active restaurant category by ID (Public)
      operationId: getActiveRestaurantCategoryById
      tags:
        - Public - Discovery
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Active restaurant category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Active restaurant category retrieved successfully
                  data:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'

  /provider/restaurants:
    get:
      summary: Get all restaurants (Provider)
      security:
        - BearerAuth: []
      operationId: getAllRestaurantsProvider
      tags:
        - Provider - Restaurants
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/searchParam'
        - $ref: '#/components/parameters/filterParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortTypeParam'

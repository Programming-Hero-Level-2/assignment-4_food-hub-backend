                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Restaurants retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'

  /provider/restaurants/{id}:
    get:
      summary: Get restaurant by ID (Provider)
      security:
        - BearerAuth: []
      operationId: getRestaurantByIdProvider
      tags:
        - Provider - Restaurants
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Restaurant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Restaurant retrieved successfully
                  data:
                    $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    patch:
      summary: Update restaurant by ID (Provider)
      security:
        - BearerAuth: []
      operationId: updateRestaurantByIdProvider
      tags:
        - Provider - Restaurants
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Pizza Palace
                opening_time:
                  type: string
                  example: '10:00 AM'
                closing_time:
                  type: string
                  example: '10:00 PM'
                address:
                  type: string
                  example: 123 Main St, Cityville
      responses:
        '200':
          description: Restaurant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantUpdateDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'

  /admin/restaurants:
    get:
      summary: Get all restaurants (Admin)
      security:
        - BearerAuth: []
      operationId: getAllRestaurantsAdmin
      tags:
        - Admin - Restaurants
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/searchParam'
        - $ref: '#/components/parameters/filterParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortTypeParam'

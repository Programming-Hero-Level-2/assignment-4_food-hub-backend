components:
  schemas:
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - updatedAt

    User:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              example: 64b64c4f2f9b9c001234567
            name:
              type: string
              example: John Doe
            email:
              type: string
              example: john.doe@mail.com
              format: email
            role:
              type: string
              example: CUSTOMER
              enum: [CUSTOMER, PROVIDER, ADMIN]
            status:
              type: string
              example: ACTIVE
              enum: [PENDING, ACTIVE, SUSPENDED]
          required:
            - id
            - name
            - email
            - role
            - status
        - $ref: '#/components/schemas/Timestamps'

    UserInput:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@mail.com
          format: email
        password:
          type: string
          example: password123
          format: password
        role:
          type: string
          example: CUSTOMER
          enum: [CUSTOMER, PROVIDER, ADMIN]
        status:
          type: string
          example: ACTIVE
          enum: [PENDING, ACTIVE, SUSPENDED]
      required:
        - name
        - email
        - password
        - role
        - status

    Restaurant:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              example: c6f1e8e2-3b5b-4d2a-9f7e-2d6f4e8e2a3b
            name:
              type: string
              example: Pizza Palace
            providerId:
              type: string
              format: uuid
              example: d4e5f6a7-8b9c-0d1e-2f3a-4b5c6d7e8f9a
            opening_time:
              type: string
              example: '10:00 AM'
            closing_time:
              type: string
              example: '10:00 PM'
            address:
              type: string
              example: 123 Main St, Cityville
            latitude:
              type: number
              example: 40.7128
            longitude:
              type: number
              example: -74.0060
            logo:
              type: string
              example: http://example.com/logo.png
              format: uri
            cover:
              type: string
              example: http://example.com/cover.jpg
              format: uri
            status:
              type: string
              example: active
              enum: [active, inactive]
            opening_status:
              type: string
              enum:
                - open
                - closed
              example: open
          required:
            - id
            - name
            - providerId
            - opening_time
            - closing_time
            - address
            - status
            - opening_status
        - $ref: '#/components/schemas/Timestamps'

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7a8b-9c0d-e1f2a3b4c5d6
        name:
          type: string
          example: Italian
        description:
          type: string
          example: Authentic Italian cuisine
        status:
          type: string
          example: active
          enum: [active, inactive]
        imageUrl:
          type: string
          nullable: true
          format: uri
          example: https://example.com/imageUrls/italian.jpg
        createdBy:
          type: string
          format: uuid
          example: 64b64c4f2f9b9c001234567
        parent:
          type: string
          nullable: true
          format: uuid
          example: 64b64c4f2f9b9c001234560
        sub_categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: b1c2d3e4-f5a6-7b8c-9d0e-f1a2b3c4d5e6
              name:
                type: string
                example: Pizza
      required:
        - id
        - name
        - status
        - createdBy

    Meal:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              example: e1f2a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
            name:
              type: string
              example: Spaghetti Carbonara
            description:
              type: string
              example: Classic Italian pasta dish with eggs, cheese, pancetta, and pepper.
            slug:
              type: string
              example: spaghetti-carbonara
            price:
              type: number
              example: 12.99
            discount:
              type: number
              example: 0.15
            discount_type:
              type: string
              example: PERCENT
              default: null
              enum: [PERCENT, FLAT, null]
            status:
              type: string
              example: AVAILABLE
              enum: [AVAILABLE, UNAVAILABLE, STOCK_OUT, ARCHIVED]
            restaurantId:
              type: string
              format: uuid
              example: 64b64c4f2f9b9c001234567
            categoryId:
              type: string
              format: uuid
              example: 64b64c4f2f9b9c001234567
            imageUrl:
              type: string
              format: uri
              example: https://example.com/imageUrls/spaghetti-carbonara.jpg
          required:
            - id
            - name
            - slug
            - price
            - discount
            - discount_type
            - status
            - restaurantId
            - categoryId
            - imageUrl
        - $ref: '#/components/schemas/Timestamps'

    RestaurantCreateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 201
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Restaurant created successfully
        data:
          $ref: '#/components/schemas/Restaurant'

    RestaurantUpdateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Restaurant updated successfully
        data:
          $ref: '#/components/schemas/Restaurant'

    ProviderDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d4e5f6a7-8b9c-0d1e-2f3a-4b5c6d7e8f9a
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john.doe@example.com
          format: email

    RestaurantCategoryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7a8b-9c0d-e1f2a3b4c5d6
        name:
          type: string
          example: Italian
        description:
          type: string
          example: Authentic Italian cuisine
      required:
        - id
        - name

    RestaurantCategoryCreateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 201
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Restaurant category created successfully
        data:
          $ref: '#/components/schemas/Category'

    RestaurantCategoryUpdateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Restaurant category updated successfully
        data:
          $ref: '#/components/schemas/Category'

    RestaurantRatingDTO:
      type: object
      properties:
        average:
          type: number
          example: 4.5
        count:
          type: integer
          format: int32
          example: 150
      required:
        - average
        - count

    MealCreateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 201
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Meal created successfully
        data:
          $ref: '#/components/schemas/Meal'

    MealUpdateDTO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Meal updated successfully
        data:
          $ref: '#/components/schemas/Meal'

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: dGhpcy1pcz1hLXJlZnJlc2gtdG9rZW4uLi4=

    AuthResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/TokenResponse'
        links:
          type: object
          additionalProperties:
            type: string
            format: uri

    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 2
        pageSize:
          type: integer
          format: int32
          example: 10
        totalPages:
          type: integer
          format: int32
          example: 5
        totalItems:
          type: integer
          format: int32
          example: 50
        next:
          type: string
          format: uri
          example: /users?page=3&pageSize=10
        previous:
          type: string
          format: uri
          example: /users?page=1&pageSize=10
      required:
        - page
        - pageSize
        - totalPages
        - totalItems

  responses:
    '201':
      description: Successfully created
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 201
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Resource created successfully

    '400':
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 400
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Bad Request
              message:
                type: string
                example: The request could not be understood or was missing required parameters.

    '401':
      description: Unauthorized access
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 401
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Unauthorized access
              message:
                type: string
                example: You don't have the right permissions to access this resource.

    '403':
      description: Forbidden - You don't have permission
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 403
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Forbidden
              message:
                type: string
                example: Forbidden - You don't have permission

    '404':
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 404
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Not Found
              message:
                type: string
                example: Resource not found

    '409':
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 409
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Conflict
              message:
                type: string
                example: Conflict - Resource already exists

    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 500
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Internal Server Error
              message:
                type: string
                example: We are sorry for the inconvenience. please try again later

  parameters:
    pageParam:
      in: query
      name: page
      description: current page number
      schema:
        type: integer
        format: int32
        example: 2

    limitParam:
      in: query
      name: pageSize
      description: Number of items per page
      schema:
        type: integer
        format: int32
        example: 10

    sortTypeParam:
      in: query
      name: sortType
      description: The type of sort (asc or dsc)
      schema:
        type: string
        enum: [asc, desc]
        example: desc

    sortByParam:
      in: query
      name: sortBy
      description: Sort key
      schema:
        type: string
        example: updatedAt

    searchParam:
      in: query
      name: search
      description: Search term to filter resources
      schema:
        type: string
        example: pizza

    filterParam:
      in: query
      name: filter
      description: Filter key
      schema:
        type: string
        example: category

    idPathParam:
      in: path
      name: id
      description: Unique identifier
      required: true
      schema:
        type: string
        format: uuid
        example: 64b64c4f2f9b9c0012345678

  # securitySchemes:
  #   BearerAuth:
  #     type: http
  #     scheme: bearer
  #     bearerFormat: JWT
  securitySchemes:
    BetterAuthSession:
      type: 'apiKey'
      in: 'cookie'
      name: 'authToken'

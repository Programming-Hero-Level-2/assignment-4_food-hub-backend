openapi: 3.0.0
info:
  title: Food Hub API
  version: 1.0.0
  description: API for Food Hub application which is food delivery service.

servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server
  - url: http://api.foodhub.com/api/v1
    description: Production Server

tags:
  - name: Auth
    description: Authentication endpoints for user (public)
  - name: Provider - Onboarding
    description: Authentication endpoints for providers (public)
  - name: Admin - Users
    description: Endpoints related to user management
  - name: Public - Discovery
    description: Public Endpoints discovery of restaurants, meals, categories, reviews, etc.
  - name: Admin - Restaurants
    description: Restaurant Endpoints (Admin only)
  - name: Provider - Restaurants
    description: Restaurant Endpoints (Provider only)
  - name: Admin - Categories
    description: Restaurant Category Endpoints (Admin only)
  - name: Provider - Categories
    description: Restaurant Category Endpoints (Provider only)
  - name: Admin - Meals / Menu
    description: Meal / Menu Endpoints (Admin only)
  - name: Provider - Meals / Menu
    description: Meal / Menu Endpoints (Provider only)
  - name: Customer - Carts
    description: Endpoints related to shopping cart management
  - name: Provider - Carts
    description: Endpoints related to shopping cart management for providers
  - name: Admin - Carts
    description: Endpoints related to shopping cart management for admins
  - name: Customer - Orders
    description: Endpoints related to order management for customers
  - name: Provider - Orders
    description: Endpoints related to order management for providers
  - name: Admin - Orders
    description: Endpoints related to order management for admins
  - name: Customer - Reviews
    description: Endpoints related to product reviews for customers
  - name: Provider - Reviews
    description: Endpoints related to product reviews for providers
  - name: Admin - Reviews
    description: Endpoints related to product reviews for admins

paths:
  /auth/register:
    post:
      summary: Register a new customer
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: john.doe@mail.com
                  format: email
                password:
                  type: string
                  minLength: 6
                  example: password123
              required:
                - name
                - email
                - password
      responses:
        '201':
          description: Customer registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'

  /auth/login:
    post:
      summary: Login a user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  example: password123
                  minLength: 6
              required:
                - email
                - password
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'

  /auth/provider/register:
    post:
      summary: Register a new provider
      tags:
        - Provider - Onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurant_name:
                  type: string
                  example: Gourmet Bites
                restaurant_address:
                  type: string
                  example: 456 Culinary Ave, Foodie City
                owner_name:
                  type: string
                  example: Alice Johnson
                email:
                  type: string
                  example: alice.johnson@mail.com
                  format: email
                password:
                  type: string
                  example: securepassword
                  format: password
              required:
                - restaurant_name
                - owner_name
                - email
                - password
      responses:
        '201':
          description: Provider registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 201
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: registered successfully, check your email to verify your account
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'

  /admin/users:
    get:
      summary: Get all users
      operationId: getUsers
      security:
        - BetterAuthSession: []
      tags:
        - Admin - Users
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/searchParam'
        - $ref: '#/components/parameters/filterParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortTypeParam'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Users retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create a new user
      operationId: createUser
      security:
        - BearerAuth: []
      tags:
        - Admin - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 201
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created successfully
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'

  /admin/users/{id}:
    get:
      summary: Get user by ID
      security:
        - BearerAuth: []
      tags:
        - Admin - Users
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User retrieved successfully
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    patch:
      summary: Update user partially
      security:
        - BearerAuth: []
      tags:
        - Admin - Users
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: john.doe@mail.com
                  format: email
                password:
                  type: string
                  example: password123
                  format: password
                role:
                  type: string
                  example: CUSTOMER
                  enum: [CUSTOMER, PROVIDER, ADMIN]
                status:
                  type: string
                  example: ACTIVE
                  enum: [PENDING, ACTIVE, SUSPENDED]
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User updated successfully
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    put:
      summary: Update user
      security:
        - BearerAuth: []
      tags:
        - Admin - Users
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User updated successfully
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      summary: Delete user
      security:
        - BearerAuth: []
      tags:
        - Admin - Users
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '204':
          description: User deleted successfully
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'

  /public/restaurants:
    get:
      summary: Get all restaurants (Public)
      operationId: getAllRestaurants
      tags:
        - Public - Discovery
      responses:
        '200':
          description: A list of restaurants
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Restaurants retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'

  /public/restaurants/{id}:
    get:
      summary: Get restaurant by ID (Public)
      operationId: getRestaurantById
      tags:
        - Public - Discovery
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Restaurant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true

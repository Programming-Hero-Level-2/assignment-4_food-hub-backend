  /provider/categories:
    get:
      summary: Get all restaurant categories (Provider)
      operationId: getAllCategoriesProvider
      tags:
        - Provider - Categories
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/sortTypeParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          description: A list of restaurant categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Restaurant categories retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create a new restaurant category (Provider)
      security:
        - BearerAuth: []
      operationId: createCategoryProvider
      tags:
        - Provider - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Fast Food
                description:
                  type: string
                  nullable: true
                  example: Category for fast food restaurants
                imageUrl:
                  type: string
                  nullable: true
                  format: uri
                  example: https://example.com/imageUrls/fast-food.jpg
                status:
                  type: string
                  enum: [active, inactive]
                  example: active
              required:
                - name
                - status
      responses:
        '201':
          description: Restaurant category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantCategoryCreateDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'

  /provider/categories/{id}:
    get:
      summary: Get a restaurant category by ID (Provider)

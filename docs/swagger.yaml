        '200':
          description: A list of active restaurant categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Active restaurant categories retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

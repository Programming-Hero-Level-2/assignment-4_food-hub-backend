        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    patch:
      summary: Update restaurant by ID (Admin)
      security:
        - BearerAuth: []
      operationId: updateRestaurantByIdAdmin
      tags:
        - Admin - Restaurants
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:

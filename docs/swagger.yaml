        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create a new restaurant (Admin)
      security:
        - BearerAuth: []
      operationId: createRestaurantAdmin
      tags:
        - Admin - Restaurants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Pizza Palace
                opening_time:
                  type: string
                  example: '10:00 AM'
                closing_time:
                  type: string
                  example: '10:00 PM'
                address:
                  type: string
                  example: 123 Main St, Cityville
              required:
                - name
                - opening_time
                - closing_time
                - address
      responses:
        '201':
          description: Restaurant created successfully
          content:
            application/json:
              schema:

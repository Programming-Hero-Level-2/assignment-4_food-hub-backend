User:
  allOf:
    - type: object
      properties:
        id:
          type: string
          format: uuid
          example: 64b64c4f2f9b9c001234567
        name:
          type: string
          example: John Doe
          format: name
        email:
          type: string
          example: john.doe@mail.com
          format: email
        phone:
          type: string
          example: +8801712345678
          format: phone
        role:
          type: string
          example: customer
          enum: [customer, provider, admin]
        status:
          type: string
          example: active
          enum: [pending, active, suspended]
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: 2024-06-01T12:00:00Z

    - $ref: '#/Timestamps'

UserInput:
  type: object
  properties:
    name:
      type: string
      example: John Doe
      format: name
    email:
      type: string
      example: john.doe@mail.com
      format: email
    password:
      type: string
      example: password123
      format: password
    address:
      type: string
      example: 123 Main St, Cityville
      format: address
    phone:
      type: string
      example: +8801712345678
      format: phone
    role:
      type: string
      example: customer
      enum: [customer, provider, admin]
    status:
      type: string
      example: active
      enum: [pending, active, suspended]
  required:
    - name
    - email
    - password
    - role
    - status

Restaurant:
  allOf:
    - type: object
      properties:
        id:
          type: string
          format: uuid
          example: c6f1e8e2-3b5b-4d2a-9f7e-2d6f4e8e2a3b
        name:
          type: string
          example: Pizza Palace
          format: name
        providerId:
          type: string
          format: uuid
          example: d4e5f6a7-8b9c-0d1e-2f3a-4b5c6d7e8f9a
        opening_time:
          type: string
          example: '10:00 AM'
          format: time
        closing_time:
          type: string
          example: '10:00 PM'
          format: time
        address:
          type: string
          example: 123 Main St, Cityville
          format: address
        latitude:
          type: number
          example: 40.7128
          formate: latitude
        longitude:
          type: number
          example: -74.0060
          format: longitude
        logo:
          type: string
          example: http://example.com/logo.png
          format: url
        cover:
          type: string
          example: http://example.com/cover.jpg
          format: url
        status:
          type: string
          example: active
          enum: [active, inactive]
          format: status
        opening_status:
          type: string
          enum:
            - open
            - closed
          example: open
          format: opening_status
      required:
        - id
        - name
        - providerId
        - opening_time
        - closing_time
        - address
        - status
        - opening_status
    - $ref: '#/Timestamps'

Category:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: a1b2c3d4-e5f6-7a8b-9c0d-e1f2a3b4c5d6
    name:
      type: string
      example: Italian
      format: name
    description:
      type: string
      example: Authentic Italian cuisine
      format: description
    status:
      type: string
      example: active
      enum: [active, inactive]
      format: status
    imageUrl:
      type: string
      nullable: true
      format: url
      example: https://example.com/imageUrls/italian.jpg
    createdBy:
      type: string
      format: uuid
      example: 64b64c4f2f9b9c001234567
    parent:
      type: string
      nullable: true
      format: uuid
      example: 64b64c4f2f9b9c001234560
    sub_categories:
      type: array
      items:
        - type: object
          properties:
            id:
              type: string
              format: uuid
              example: b1c2d3e4-f5a6-7b8c-9d0e-f1a2b3c4d5e6
            name:
              type: string
              example: Pizza
              format: name
    $ref: '#/Timestamps'
  required:
    - id
    - name
    - status
    - createdBy

Meal:
  allOf:
    - type: object
      properties:
        id:
          type: string
          format: uuid
          example: e1f2a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
        name:
          type: string
          example: Spaghetti Carbonara
          format: name
        description:
          type: string
          format: description
          example: Classic Italian pasta dish with eggs, cheese, pancetta, and pepper.
        slug:
          type: string
          format: slug
          example: spaghetti-carbonara
        price:
          type: number
          format: float
          example: 12.99
        discount:
          type: number
          format: float
          example: 0.15
        discount_type:
          type: string
          format: discountType
          example: PERCENT
          default: null
          enum: [PERCENT, FLAT, null]
        status:
          type: string
          format: status
          example: AVAILABLE
          enum: [AVAILABLE, UNAVAILABLE, STOCK_OUT, ARCHIVED]
        restaurantId:
          type: string
          format: uuid
          example: 64b64c4f2f9b9c001234567
        categoryId:
          type: string
          format: uuid
          example: 64b64c4f2f9b9c001234567
        imageUrl:
          type: string
          format: uri
          example: https://example.com/imageUrls/spaghetti-carbonara.jpg
        thumbnails:
          type: array
          items:
            type: string
            format: uri
            example: https://example.com/imageUrls/spaghetti-carbonara-thumb.jpg
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: 64b64c4f2f9b9c001234567
              name:
                type: string
                example: Italian
                format: name
    - required:
        - id
        - name
        - slug
        - price
        - discount
        - discount_type
        - status
        - restaurantId
        - categoryId
        - imageUrl
    - $ref: '#/Timestamps'


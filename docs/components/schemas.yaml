    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - createdAt
    - updatedAt

Pagination:
  type: object
  properties:
    page:
      type: integer
      format: int32
      example: 2
    limit:
      type: integer
      format: int32
      example: 10
    totalPages:
      type: integer
      format: int32
      example: 5
    totalItems:
      type: integer
      format: int32
      example: 50
    next:
      type: string
      format: url
      example: /users?page=3&limit=10
    previous:
      type: string
      format: url
      example: /users?page=1&limit=10
  required:
    - page
    - limit
    - totalPages
    - totalItems

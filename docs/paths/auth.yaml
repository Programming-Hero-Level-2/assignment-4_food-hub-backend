register:
  post:
    summary: Register a new customer
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: John Doe
                format: name
              email:
                type: string
                example: john.doe@mail.com
                format: email
              password:
                type: string
                minLength: 6
                example: password123
            required:
              - name
              - email
              - password
    responses:
      '201':
        description: Customer registered successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthResponse'
            example:
              code: 201
              success: true
              message: registered successfully
              data:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: dGhpcy1pcz1hLXJlZnJlc2gtdG9rZW4uLi4=
              links:
                self: /auth/register
                login: /auth/login
      '400':
        $ref: '../components/responses.yaml#/400'
      '409':
        $ref: '../components/responses.yaml#/409'
      '500':
        $ref: '../components/responses.yaml#/500'

login:
  post:
    summary: Login a user
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
                example: password123
                minLength: 6
            required:
              - email
              - password
    responses:
      '200':
        description: User logged in successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthResponse'
            example:
              code: 200
              success: true
              message: logged in successfully
              data:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: dGhpcy1pcz1hLXJlZnJlc2gtdG9rZW4uLi4=
              links:
                self:
                  type: string
                  example: /auth/login
                register:
                  type: string
                  example: /auth/register
                provider_register:
                  type: string
                  example: /auth/provider/register
      '400':
        $ref: '../components/responses.yaml#/400'
      '500':
        $ref: '../components/responses.yaml#/500'

providerRegister:
  post:
    summary: Register a new provider
    tags:
      - Provider - Onboarding
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              restaurant_name:
                type: string
                example: Gourmet Bites
                format: name
              restaurant_address:
                type: string
                example: 456 Culinary Ave, Foodie City
                format: address
              owner_name:
                type: string
                example: Alice Johnson
                format: name
              email:
                type: string
                example: alice.johnson@mail.com
                format: email
              password:
                type: string
                example: securepassword
                format: password
            required:
              - restaurant_name
              - owner_name
              - email
              - password
    responses:
      '201':
        description: Provider registered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  format: int32
                  example: 201
                success:
                  type: boolean
                  format: boolean
                  example: true
                message:
                  type: string
                  format: message
                  example: registered successfully, check your email to verify your account
                links:
                  type: object
                  properties:
                    self:
                      type: string
                      example: /auth/provider/register
                    login:
                      type: string
                      example: /auth/login
      '400':
        $ref: '../components/responses.yaml#/400'
      '409':
        $ref: '../components/responses.yaml#/409'
      '500':
        $ref: '../components/responses.yaml#/500'

customerCarts:
  get:
    summary: Get all carts for the authenticated user
    tags:
      - Customer - Carts
    security:
      - BearerAuth: []
    operationId: getCustomerCarts
    responses:
      '200':
        description: A list of carts for the authenticated user
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: c6f1e8e2-3b5b-4d2a-9f7e-2d6f4e8e2a3b
                  meals:
                    type: array
                    items:
                      type: object
                      properties:
                        mealId:
                          type: string
                          format: uuid
                          example: 123e4567-e89b-12d3-a456-426614174000
                        quantity:
                          type: integer
                          example: 2
                  totalPrice:
                    type: number
                    format: float
                    example: 29.99
                  discount:
                    type: number
                    format: float
                    example: 5.00
                  createdAt:
                    type: string
                    format: date-time
                    example: 2024-06-01T12:00:00Z
                  updatedAt:
                    type: string
                    format: date-time
                    example: 2024-06-01T12:00:00Z
                  imageUrl:
                    type: string
                    format: url
                    example: https://example.com/imageUrls/cart-image.jpg
customerCartByRestaurant:
  get:
    summary: Get the cart for a specific restaurant
    tags:
      - Customer - Carts
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier of the restaurant
        schema:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
    responses:
      '200':
        description: The cart for the specified restaurant
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: c6f1e8e2-3b5b-4d2a-9f7e-2d6f4e8e2a3b
                meals:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 123e4567-e89b-12d3-a456-426614174000
                      quantity:
                        type: integer
                        example: 2
                      basePrice:
                        type: number
                        format: float
                        example: 15.00
                      discount:
                        type: number
                        format: float
                        example: 2.00
                      imageUrl:
                        type: string
                        format: url
                        example: https://example.com/imageUrls/cart-image.jpg
                subTotal:
                  type: number
                  format: float
                  example: 30.00
                deliveryFee:
                  type: number
                  format: float
                  example: 5.00
                serviceFee:
                  type: number
                  format: float
                  example: 2.00
                vat:
                  type: number
                  format: float
                  example: 2.50
                totalPrice:
                  type: number
                  format: float
                  example: 29.99
                currency:
                  type: string
                  example: USD

                createdAt:
                  type: string
                  format: date-time
                  example: 2024-06-01T12:00:00Z
                updatedAt:
                  type: string
                  format: date-time
                  example: 2024-06-01T12:00:00Z
      400:
        $ref: '../components/responses.yaml#/400'
      401:
        $ref: '../components/responses.yaml#/401'
      403:
        $ref: '../components/responses.yaml#/403'
      '500':
        $ref: '../components/responses.yaml#/500'
